          categoryNameVi: "Doanh số"
          columns:
            - code: revenue
              titleEn: "Revenue"
              titleVi: "Doanh số"
              type: DECIMAL
              is-cost: true
              mapping: revenue
              hasFilter: true
              summary-type: SUM

            - code: profit
              titleEn: "Profit"
              titleVi: "Lợi nhuận"
              type: DECIMAL
              is-cost: true
              mapping: profit
              hasFilter: true
              summary-type: SUM

            - code: true_revenue
              titleEn: "True revenue"
              titleVi: "Doanh thu"
