nemi:
  column-config:
    report:
      default-columns:
        - revenue
        - orders
        - ad_cost
        - ad_cost_per_revenue
        - ad_cost_per_order
        - confirmed_orders
        - returned_orders
        - success_orders
        - profit

      system-views:
        - code: overview
          title-en: "Overview"
          title-vi: "Tổng quan"
          columns:
            - revenue
            - orders
            - ad_cost
            - ad_cost_per_revenue
            - ad_cost_per_order
            - confirmed_orders
            - returned_orders
            - success_orders
